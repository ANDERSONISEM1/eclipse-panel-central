apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: letsencrypt-aisemc
  namespace: aisemc
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: aisemc@miumg.edu.gt
    privateKeySecretRef:
      name: letsencrypt-aisemc-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
            # Tu namespace tiene cuota de NodePort = 0, por eso se usa ClusterIP
            serviceType: ClusterIP