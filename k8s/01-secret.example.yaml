# PLANTILLA con valores falsos. NO aplicar tal cual: sobrescribiría el Secret real.
# Crear el Secret real con:
#   kubectl create secret generic eclipse-secret -n aisemc `
#     --from-literal=DB_CONNECTION='<cadena-de-conexion>' `
#     --from-literal=AGENT_KEY='<clave-de-agentes>' `
#     --from-literal=ADMIN_PASSWORD='<password-admin>' `
#     --from-literal=POSTGRES_PASSWORD='<password-postgres>'
apiVersion: v1
kind: Secret
metadata:
  name: eclipse-secret
  namespace: aisemc
type: Opaque
stringData:
  DB_CONNECTION: "CAMBIAR"
  AGENT_KEY: "CAMBIAR"
  ADMIN_PASSWORD: "CAMBIAR"
  POSTGRES_PASSWORD: "CAMBIAR"