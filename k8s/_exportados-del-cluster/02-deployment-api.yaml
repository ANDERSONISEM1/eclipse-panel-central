apiVersion: apps/v1
kind: Deployment
metadata:
  name: eclipse-api
  namespace: aisemc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eclipse-api
  template:
    metadata:
      labels:
        app: eclipse-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
      containers:
        - name: eclipse-api
          image: andersonclay/eclipse-api:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DB_CONNECTION
              valueFrom:
                secretKeyRef:
                  name: eclipse-secret
                  key: DB_CONNECTION
            - name: AGENT_KEY
              valueFrom:
                secretKeyRef:
                  name: eclipse-secret
                  key: AGENT_KEY
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eclipse-secret
                  key: ADMIN_PASSWORD
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 90
            periodSeconds: 10
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi