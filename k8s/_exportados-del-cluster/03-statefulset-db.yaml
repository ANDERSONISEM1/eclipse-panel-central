apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: eclipse-db
  namespace: aisemc
spec:
  replicas: 1
  serviceName: eclipse-db
  selector:
    matchLabels:
      app: eclipse-db
  template:
    metadata:
      labels:
        app: eclipse-db
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
              name: pg
          env:
            - name: POSTGRES_DB
              value: eclipse_monitoreo
            - name: POSTGRES_USER
              value: eclipse
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eclipse-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "eclipse", "-d", "eclipse_monitoreo"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "eclipse", "-d", "eclipse_monitoreo"]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: datos
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: initdb
          configMap:
            name: eclipse-initdb
  volumeClaimTemplates:
    - metadata:
        name: datos
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi