apiVersion: apps/v1
kind: Deployment
metadata:
  name: eclipse-web
  namespace: aisemc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eclipse-web
  template:
    metadata:
      labels:
        app: eclipse-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: eclipse-web
          image: eclipse-web
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: eclipse-web
  namespace: aisemc
spec:
  selector:
    app: eclipse-web
  ports:
    - name: http
      port: 80
      targetPort: 8080